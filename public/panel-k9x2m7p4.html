<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joudy Analytics</title><style>body{font:15px system-ui;background:#101827;color:#eef2ff;margin:0;padding:24px}main{max-width:1100px;margin:auto}input,button{padding:11px;border-radius:9px;border:1px solid #46536a;background:#1d293b;color:white;margin:4px}button{cursor:pointer}pre{white-space:pre-wrap;overflow:auto;background:#1d293b;padding:14px;border-radius:10px}.muted{color:#aab6ca}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#1d293b;padding:16px;border-radius:12px;margin:12px 0}</style><main><h1>Joudy Analytics</h1><p class="muted">Private dashboard · authorized access only</p><section id="login" class="card"><input id="pw" type="password" placeholder="Admin password"><button id="go">Sign in</button><p id="err"></p></section><section id="app" hidden><div class="row"><button id="refresh">Refresh</button><button id="json">Export JSON</button><button id="csv">Export events CSV</button><button id="del">Delete all analytics</button></div><div id="summary" class="card"></div><input id="q" placeholder="Filter sessions" oninput="filterRows()"><div id="sessions"></div><h2>Recent events</h2><pre id="events"></pre></section></main><script>
let password='', cache={sessions:[],events:[]}; const $=id=>document.getElementById(id);
async function api(action='read'){const r=await fetch('/api/player',{method:'POST',headers:{'content-type':'application/json','x-admin-password':password},body:JSON.stringify({action})});if(!r.ok)throw new Error((await r.json()).error||'Request failed');return r.json()}
$('go').onclick=async()=>{password=$('pw').value;try{await load();$('login').hidden=true;$('app').hidden=false}catch(e){$('err').textContent=e.message;password=''}};
async function load(){cache=await api();$('summary').textContent=`Sessions: ${cache.sessions.length} · Players: ${new Set(cache.sessions.map(x=>x.player_id)).size} · Events: ${cache.events.length} · Wins: ${cache.events.filter(x=>x.event_type==='game_win').length} · Losses: ${cache.events.filter(x=>x.event_type==='game_loss').length}`;render();}
function render(){const q=$('q').value.toLowerCase();$('sessions').innerHTML=cache.sessions.filter(s=>[s.player_id,s.device,s.browser,s.referrer_host].join(' ').toLowerCase().includes(q)).map(s=>`<div class="card"><b>${s.device||'Unknown device'} · ${s.browser||'Unknown browser'}</b><p class="muted">Player ${s.player_id} · Session ${s.session_id}</p><p>Last seen: ${s.last_seen_at} · ${s.timezone||''} · ${s.screen||''}</p></div>`).join('');$('events').textContent=cache.events.slice(0,150).map(e=>`${e.occurred_at} | ${e.event_type} | ${e.session_id} | ${JSON.stringify(e.payload)}`).join('\n')}
window.filterRows=render;$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('json').onclick=()=>download('joudy-analytics.json',JSON.stringify(cache,null,2),'application/json');$('csv').onclick=()=>{const rows=[['time','event','player','session','payload'],...cache.events.map(e=>[e.occurred_at,e.event_type,e.player_id,e.session_id,JSON.stringify(e.payload)])];download('joudy-events.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};$('del').onclick=async()=>{if(confirm('Delete all analytics records?')){await api('delete');await load()}};function download(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
</script></html>
